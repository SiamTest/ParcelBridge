name: Clean completed Actions runs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'all_completed removes all completed runs now; automatic preserves failed runs for 20 minutes'
        type: choice
        options: [all_completed, automatic]
        default: all_completed
  workflow_run:
    workflows: [Test and build, Android release, Deploy Cloudflare API, Upload Google Play draft]
    types: [completed]
  # GitHub has no delayed workflow_run trigger. Periodic sweeps remove failures
  # once their 20-minute diagnostic window has elapsed (timing is best-effort).
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: parcelbridge-actions-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete completed workflow runs
        uses: actions/github-script@v8
        env:
          CLEANUP_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'automatic' }}
          CLEANUP_SUCCESS_MINUTES: ${{ vars.CLEANUP_SUCCESS_MINUTES || '0' }}
          CLEANUP_FAILURE_MINUTES: ${{ vars.CLEANUP_FAILURE_MINUTES || '20' }}
        with:
          script: |
            const cleanup = require('./scripts/cleanup-runs.cjs');
            await cleanup({ github, context, core, env: process.env });

name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run check && npm test && npm audit --omit=dev --audit-level=high
        working-directory: api
      - run: npx wrangler deploy --dry-run --outdir build
        working-directory: api
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test scripts/*.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon testDirectDebugUnitTest testPlayDebugUnitTest lintDirectDebug lintPlayDebug assembleDirectDebug assemblePlayDebug
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: parcelbridge-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: app/build/reports/
          retention-days: 7
  automation:
    needs: [api, android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      release: ${{ steps.plan.outputs.release }}
      play: ${{ steps.plan.outputs.play }}
    steps:
      - uses: actions/checkout@v4
      - name: Check current source and available credentials
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AUTO_DEPLOY_API: ${{ vars.AUTO_DEPLOY_API }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
          AUTO_UPLOAD_PLAY: ${{ vars.AUTO_UPLOAD_PLAY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export CURRENT_MAIN_SHA
          python3 scripts/automation-plan.py
  deploy:
    needs: automation
    if: needs.automation.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit
  release:
    needs: [automation, deploy]
    if: >-
      !cancelled() && needs.automation.outputs.release == 'true' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      upload_play: ${{ needs.automation.outputs.play == 'true' }}
    secrets: inherit

name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checked-out source may not contain api/package-lock.json on every ref.
      # Missing cache metadata must not break the Node toolchain setup.
      - name: Detect API lockfile for optional npm caching
        id: npm-lock
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/api/package-lock.json" ]; then
            echo 'cache=npm' >> "$GITHUB_OUTPUT"
          else
            echo 'cache=' >> "$GITHUB_OUTPUT"
            echo '::warning::api/package-lock.json is absent in this checkout; npm caching disabled.'
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ steps.npm-lock.outputs.cache }}
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run check && npm test && npm audit --omit=dev --audit-level=high
        working-directory: api
      - run: npx wrangler deploy --dry-run --outdir build
        working-directory: api
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node --test scripts/*.test.mjs
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon testDirectDebugUnitTest testPlayDebugUnitTest lintDirectDebug lintPlayDebug assembleDirectDebug assemblePlayDebug
      - name: Ensure APKs have no embedded Worker origin
        run: python3 scripts/verify-apk-endpoints.py app/build/outputs/apk/direct/debug/app-direct-debug.apk app/build/outputs/apk/play/debug/app-play-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: parcelbridge-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: app/build/reports/
          retention-days: 7
  android-startup-smoke:
    # Robolectric cannot fully exercise Android 16's framework and Material renderer.
    # A real emulator launch is a release gate for immediate-startup crashes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon assembleDirectDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify emulator workflow revision
        shell: bash
        run: |
          set -euo pipefail
          echo "ParcelBridge workflow revision: android-16-bash-entrypoint-v2"
          echo "Commit: $GITHUB_SHA"
          grep -Fqx '          script: bash scripts/android-startup-smoke.sh' .github/workflows/ci.yml
          test -f scripts/android-startup-smoke.sh
          bash -n scripts/android-startup-smoke.sh
          echo "Bash smoke-test entrypoint verified."
      - name: Android 16 cold-start smoke test (Bash entrypoint v2)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # The emulator action executes script via /bin/sh and splits multiline
          # inputs. Invoke one Bash file as a single command instead.
          script: bash scripts/android-startup-smoke.sh
      - name: Upload Android startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-16-startup-diagnostics
          path: build/android-startup-smoke/
          if-no-files-found: ignore
          retention-days: 7
  automation:
    needs: [api, android, android-startup-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Android and API source changes
        if: github.event_name == 'push'
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGE_MODE: push
          COMMIT_BASE: ${{ github.event.before }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/changed-project-paths.mjs
      - name: Check current source and available credentials
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_DEPLOY_API: ${{ vars.AUTO_DEPLOY_API }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
          AUTO_UPLOAD_PLAY: ${{ vars.AUTO_UPLOAD_PLAY }}
          API_CONTENT_CHANGED: ${{ github.event_name == 'push' && steps.changes.outputs.api_changed || 'true' }}
          RELEASE_CONTENT_CHANGED: ${{ github.event_name == 'push' && steps.changes.outputs.app_changed || 'true' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          CURRENT_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export CURRENT_MAIN_SHA
          python3 scripts/automation-plan.py
  deploy:
    # Self-contained deployment avoids requiring another workflow to exist in
    # the same commit; manual deployments still use deploy-api.yml.
    needs: automation
    if: needs.automation.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: parcelbridge-api-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: api
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # The checked-out source may not contain api/package-lock.json on every ref.
      # Missing cache metadata must not break the Node toolchain setup.
      - name: Detect API lockfile for optional npm caching
        id: npm-lock
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/api/package-lock.json" ]; then
            echo 'cache=npm' >> "$GITHUB_OUTPUT"
          else
            echo 'cache=' >> "$GITHUB_OUTPUT"
            echo '::warning::api/package-lock.json is absent in this checkout; npm caching disabled.'
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ steps.npm-lock.outputs.cache }}
          cache-dependency-path: api/package-lock.json
      - name: Validate API configuration
        run: |
          set -euo pipefail
          for setting in TURSO_DATABASE_URL TURSO_AUTH_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!setting}" ]; then
              echo "::error::Missing $setting in production environment or repository secrets"
              exit 1
            fi
          done
      - name: Test and migrate API
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev --audit-level=high
          npm run migrate
      - name: Deploy Cloudflare Worker
        run: |
          node -e 'require("node:fs").writeFileSync("secrets.json", JSON.stringify({TURSO_DATABASE_URL:process.env.TURSO_DATABASE_URL,TURSO_AUTH_TOKEN:process.env.TURSO_AUTH_TOKEN}), {mode:0o600})'
          npx wrangler deploy --secrets-file secrets.json --var "GITHUB_REPOSITORY:$GITHUB_REPOSITORY"
          npx wrangler deploy --config edge/wrangler.jsonc
      - name: Delete temporary secrets
        if: always()
        run: rm -f secrets.json

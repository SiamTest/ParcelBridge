name: Upload Google Play draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed GitHub release tag (for example v0.1.0)
        required: true
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      track:
        type: string
        default: internal
permissions:
  contents: read
concurrency:
  group: parcelbridge-play-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Download the signed bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release
          gh release download "$RELEASE_TAG" --pattern parcelbridge-play.aab --pattern update.json --dir release
      - uses: google-github-actions/auth@v3
        id: google
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
      - name: Create draft release in Google Play
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          PLAY_TRACK: ${{ inputs.track }}
        run: python3 scripts/publish-play.py

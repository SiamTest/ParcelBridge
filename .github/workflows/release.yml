name: Signed Android release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      APP_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate release configuration and restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$API_BASE_URL" && test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((APP_VERSION_CODE + 1000))" >> "$GITHUB_ENV"
      - run: npm ci && npm run check && npm test && npm audit --omit=dev --audit-level=high
        working-directory: api
      - run: gradle --no-daemon testDirectReleaseUnitTest testPlayReleaseUnitTest lintDirectRelease lintPlayRelease assembleDirectRelease bundlePlayRelease
      - name: Prepare signed release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/direct/release/app-direct-release.apk release/parcelbridge.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab release/parcelbridge-play.aab
          node scripts/release-manifest.mjs
      - name: Publish GitHub APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/parcelbridge.apk release/parcelbridge-play.aab release/update.json --verify-tag --generate-notes
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: release/
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

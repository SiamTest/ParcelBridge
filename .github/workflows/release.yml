name: Signed Android release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload_play:
        description: Upload a Google Play draft if credentials are configured
        type: boolean
        default: true
  workflow_call:
    inputs:
      upload_play:
        type: boolean
        default: true
    outputs:
      tag:
        value: ${{ jobs.release.outputs.tag }}
permissions:
  contents: read
concurrency:
  group: parcelbridge-signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      play: ${{ steps.play.outputs.enabled }}
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release configuration and restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=false
          for setting in API_BASE_URL KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!setting}" ]; then
              name="$setting"
              [ "$setting" != KEYSTORE_BASE64 ] || name=ANDROID_KEYSTORE_BASE64
              echo "::error::Missing $name. Configure it in Settings > Secrets and variables > Actions at repository scope or in the production environment."
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            echo 'API_BASE_URL accepts a variable or secret and must be your deployed HTTPS Worker origin (without /v1). Signing settings must be secrets.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Choose an increasing Android version
        id: version
        env:
          REQUESTED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/release-version.mjs
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm ci && npm run check && npm test && npm audit --omit=dev --audit-level=high
        working-directory: api
      - run: gradle --no-daemon testDirectReleaseUnitTest testPlayReleaseUnitTest lintDirectRelease lintPlayRelease assembleDirectRelease bundlePlayRelease
      - name: Prepare signed release assets
        run: |
          mkdir -p release
          cp app/build/outputs/apk/direct/release/app-direct-release.apk release/parcelbridge.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab release/parcelbridge-play.aab
          node scripts/release-manifest.mjs
      - name: Publish GitHub APK release
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$RELEASE_TAG" release/parcelbridge.apk release/parcelbridge-play.aab release/update.json --target "$GITHUB_SHA" --draft --generate-notes
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: release/
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Check optional Play draft configuration
        id: play
        env:
          UPLOAD_PLAY_REQUESTED: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.upload_play }}
          AUTO_UPLOAD_PLAY: ${{ vars.AUTO_UPLOAD_PLAY }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os
          value = os.environ['AUTO_UPLOAD_PLAY'].strip().lower()
          assert value in ('', 'true', 'false'), 'AUTO_UPLOAD_PLAY must be true or false'
          enabled = os.environ['UPLOAD_PLAY_REQUESTED'] == 'true' and value != 'false' and bool(os.environ['GOOGLE_PLAY_SERVICE_ACCOUNT_JSON'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'enabled={str(enabled).lower()}\n')
          PY
  play:
    needs: release
    if: needs.release.outputs.play == 'true'
    uses: ./.github/workflows/play.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      track: ${{ vars.PLAY_TRACK || 'internal' }}
    secrets: inherit

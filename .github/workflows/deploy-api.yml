name: Deploy Cloudflare API
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: parcelbridge-api-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: api
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # The checked-out source may not contain api/package-lock.json on every ref.
      # Missing cache metadata must not break the Node toolchain setup.
      - name: Detect API lockfile for optional npm caching
        id: npm-lock
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/api/package-lock.json" ]; then
            echo 'cache=npm' >> "$GITHUB_OUTPUT"
          else
            echo 'cache=' >> "$GITHUB_OUTPUT"
            echo '::warning::api/package-lock.json is absent in this checkout; npm caching disabled.'
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ steps.npm-lock.outputs.cache }}
          cache-dependency-path: api/package-lock.json
      - run: npm ci && npm run check && npm test && npm audit --omit=dev --audit-level=high
      - name: Check configuration
        run: |
          test -n "$TURSO_DATABASE_URL"
          test -n "$TURSO_AUTH_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - run: npm run migrate
      - name: Deploy code and private database bindings
        run: |
          node -e 'require("node:fs").writeFileSync("secrets.json", JSON.stringify({TURSO_DATABASE_URL:process.env.TURSO_DATABASE_URL,TURSO_AUTH_TOKEN:process.env.TURSO_AUTH_TOKEN}), {mode:0o600})'
          npx wrangler deploy --secrets-file secrets.json --var "GITHUB_REPOSITORY:$GITHUB_REPOSITORY"
          npx wrangler deploy --config edge/wrangler.jsonc
      - name: Delete temporary secrets
        if: always()
        run: rm -f secrets.json
